# plotipus project: `plotipus run dune` draws every command in
# input/plots/dune_scripts.txt into output/plots.
[project]
data_root = "input/data"
plots = "input/plots"
tables = "input/tables"
output = "output"
style = ["config/style.json"]
python_path = ["src"]
plugins = ["dune_plotipus"]

[settings]
dune_label = "simulation"
