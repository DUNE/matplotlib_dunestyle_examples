# plotipus project: `plotipus run <list>` draws every command of
# input/plots/<list>_scripts.txt into output/plots (`python run.py` runs all lists).
[project]
data_root = "input/data"
plots = "input/plots"
tables = "input/tables"
output = "output"
# "classic" keeps plotipus' own look out of the way (8x6 in, 100 dpi, red fit
# lines), so the dune_plot_style sheet applied by the plugin decides the style.
style = ["classic", "config/style.json"]
python_path = ["src"]
plugins = ["dune_plotipus"]

[settings]
dune_label = "simulation"
